name: Selenium Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Jalankan tes (paralel, headless)
        env:
          HEADLESS: "1"
        run: pytest -v -n 2 --html=report.html --self-contained-html

      - name: Unggah laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-pengujian
          path: report.html